[package]
name = "mybelovedrubble"
version = "0.1.0"
edition = "2024"

[lib]
name = "mbr"
path = "src/lib.rs"

[[bin]]
name = "mbr"
path = "src/cli.rs"

[[bin]]
name = "my-beloved-rubble"
path = "src/gui.rs"

[build-dependencies]
slint-build = "1.11"

[dependencies]
slint = "1.17"
minisqlite = { git = "https://github.com/cursor/minisqlite" }
sha2 = "0.10"
rfd = "0.15"
dirs = "6"
log = "0.4"
env_logger = "0.11"
serde_json = "1"
librclone = "0.9"
rpassword = "7"
clap = { version = "4", features = ["derive"] }
age = "0.11"
argon2 = "0.5"
serde = { version = "1", features = ["derive"] }

# Password hashing and age's scrypt are deliberately slow; unoptimized they
# take seconds, so optimize them even in debug builds.
[profile.dev.package]
argon2.opt-level = 3
blake2.opt-level = 3
scrypt.opt-level = 3
salsa20.opt-level = 3
pbkdf2.opt-level = 3
sha2.opt-level = 3

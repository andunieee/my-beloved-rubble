[package]
name = "mybelovedrubble"
version = "0.1.1"
edition = "2024"
license = "AGPL-3.0-or-later"

[lib]
name = "mbr"
path = "src/lib.rs"

[[bin]]
name = "mbr"
path = "src/cli.rs"

[[bin]]
name = "my-beloved-rubble"
path = "src/gui.rs"

# Renders the screenshots in docs/static/screenshots, see src/screenshots.rs
[[bin]]
name = "screenshots"
path = "src/bin/screenshots.rs"
required-features = ["screenshots"]

[features]
screenshots = ["slint/software-renderer-systemfonts", "dep:png"]

[build-dependencies]
slint-build = "1.11"

[dependencies]
slint = "1.17"
sha2 = "0.10"
dirs = "6"
log = "0.4"
env_logger = "0.11"
serde_json = "1"
librclone = "0.9"
rpassword = "7"
clap = { version = "4", features = ["derive"] }
age = "0.11"
argon2 = "0.5"
serde = { version = "1", features = ["derive"] }
tar = "0.4.46"
flate2 = "1.1.10"
iroh-docs = { version = "0.101", default-features = false, features = ["fs-store"] }
iroh-blobs = { version = "0.103", default-features = false, features = ["fs-store"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "macros"] }
iroh = "1.3"
iroh-mdns-address-lookup = "0.6"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
postcard = { version = "1.1", features = ["use-std"] }
png = { version = "0.18", optional = true }

# The desktop GUI's file dialogs and links (see `platform` in src/gui.rs).
[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.15"
open = "5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Password hashing and age's scrypt are deliberately slow; unoptimized they
# take seconds, so optimize them even in debug builds.
[profile.dev.package]
argon2.opt-level = 3
blake2.opt-level = 3
scrypt.opt-level = 3
salsa20.opt-level = 3
pbkdf2.opt-level = 3
sha2.opt-level = 3

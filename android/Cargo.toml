# The Android app: the GUI of src/gui.rs as a native activity. Build it
# with android/build.sh (see the README).
# Its own workspace: cargo-apk wants a package that isn't part of the
# main one.
[workspace]

[package]
name = "mybelovedrubble-android"
version = "0.1.1"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "mybelovedrubble"
path = "lib.rs"
crate-type = ["cdylib"]

[dependencies]
mybelovedrubble = { path = ".." }
slint = { version = "1.17", features = ["backend-android-activity-06"] }
age = "0.11"
log = "0.4"
serde_json = "1"
android_logger = "0.15"
jni = "0.21"
ndk-context = "0.1"

[build-dependencies]
slint-build = "1.11"

[package.metadata.android]
package = "computer.mybelovedrubble"
apk_name = "my-beloved-rubble"
build_targets = ["aarch64-linux-android"]
# rclone's shared library (see build.sh).
runtime_libs = "runtime-libs"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "My Beloved Rubble"

[package.metadata.android.application.activity]
config_changes = "orientation|screenSize|screenLayout|keyboardHidden"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"

[[package.metadata.android.uses_permission]]
name = "android.permission.CHANGE_WIFI_MULTICAST_STATE"
